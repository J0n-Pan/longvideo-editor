<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>长素材选句工作台</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><div class="brand"><span class="brand-icon"><img src="/static/personal-logo.png" alt="Jon 个人 logo"></span><b>长素材选句工作台</b></div><div class="head-actions"><span id="saveState" class="muted">本地项目</span><button id="jobsBtn" class="quiet" aria-haspopup="dialog" aria-controls="jobsDialog">后台任务<span id="activeJobCount" class="badge" hidden></span></button><button id="settingsBtn" class="quiet">设置</button></div></header>
<div class="import-bar"><select id="projectSelect" aria-label="选择原视频"><option value="">选择原视频</option></select><button id="importBtn" type="button">导入素材</button></div>
<main>
<section class="preview-panel"><div class="section-title preview-title"><div class="preview-title-main"><h2>原片预览</h2><span id="sourceMeta" class="muted preview-meta"></span></div><span id="playTime" class="mono">00:00</span></div><video id="video" controls preload="metadata"></video><div class="preview-actions"><label>播放速度 <select id="speed"><option>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><button id="stopPreview" class="quiet">停止组预览</button></div><div id="nowPlaying" class="now-playing">点击文稿中的句子，跳转到对应画面</div><div class="section-title exports-title"><h2>已导出</h2><button id="refreshExports" class="quiet">刷新</button></div><div id="exports" class="exports"></div></section>
<section class="transcript-panel">
  <div class="section-title"><h2>转写文稿 <span id="sentenceCount" class="badge">0</span></h2><button id="exportTranscript" class="quiet" disabled>导出文稿</button></div>
  <div class="transcript-tools"><input id="search" placeholder="搜索文稿，例如：记忆法" aria-label="搜索文稿"></div>
  <div class="selection-tools">
    <div class="selection-summary"><span id="selectionCount" class="muted" role="status">未选择句子</span><button id="clearSelection" class="quiet" disabled>清除选择</button></div>
    <div class="selection-actions"><button id="bulkSelectionBtn" class="quiet batch-toggle" aria-expanded="false" aria-controls="bulkSelectionPanel"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m3 5 1.5 1.5L7 4M10 5h7M3 11l1.5 1.5L7 10M10 11h7M10 17h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>批量选择<span class="chevron" aria-hidden="true">⌄</span></button><button id="addSelected" disabled>加入当前组 →</button></div>
  </div>
  <div id="bulkSelectionPanel" class="batch-panel" hidden>
    <form id="bulkSelectionForm">
      <div class="batch-heading"><label for="selectionRange">按原文序号选择</label><span id="rangeBounds" class="muted"></span></div>
      <div class="batch-input-row"><input id="selectionRange" placeholder="如：1-5, 8, 12-15" autocomplete="off" aria-describedby="rangeHint selectionRangeError"><button id="applyRange" type="submit">选择</button></div>
      <p id="rangeHint" class="batch-note">支持连续或间隔序号，保留已勾选的句子。</p>
      <p id="selectionRangeError" class="batch-error" role="alert" hidden></p>
    </form>
  </div>
  <div id="transcript" class="transcript"><div class="empty large">导入视频后自动生成文稿。</div></div>
</section>
<section class="groups-panel"><div class="section-title"><h2>短片分组</h2><button id="newGroup" class="quiet">＋ 新建</button></div><div id="groupTabs" class="group-tabs"></div><div class="name-row"><label for="groupName">导出名称</label><input id="groupName" placeholder="例如：记忆法适合哪些孩子"></div><div class="group-tools"><span id="groupDuration" class="mono">00:00</span><button id="undo" class="quiet">撤销</button><button id="deleteGroup" class="danger quiet">删除组</button></div><div id="groupItems" class="group-items"><div class="empty">选择文稿中的句子，加入当前组。</div></div><div class="export-controls"><button id="previewGroup" class="quiet">预览当前组</button><button id="planExports" class="quiet">查看导出清单</button><button id="exportGroup">导出当前组</button><button id="exportAll">导出全部组</button></div><div id="exportPlan" class="export-plan"></div></section>
</main>
<div id="toast" class="toast" role="status"></div>
<dialog id="jobsDialog" class="jobs-dialog" aria-labelledby="jobsTitle"><div class="section-title"><h2 id="jobsTitle">后台任务</h2><div class="dialog-header-actions"><button id="refreshJobs" class="quiet">刷新</button><button id="closeJobs" class="quiet">关闭</button></div></div><div id="jobs" class="jobs"><div class="empty">暂无任务</div></div></dialog>
<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="section-title"><h2 id="settingsTitle">本机设置</h2><button id="closeSettings" class="quiet">关闭</button></div>
  <div id="exportSettingsForm" class="location-settings">
    <div class="location-card"><div class="location-copy"><h3>视频导出位置</h3><p id="exportPath" class="location-value"></p></div><div class="location-action"><button id="changeExportPath" type="button" class="quiet folder-change" aria-label="更改视频导出位置">更改</button></div></div>
    <div class="location-card"><div class="location-copy"><h3>文稿导出位置</h3><p id="transcriptExportPath" class="location-value"></p></div><div class="location-action"><button id="changeTranscriptPath" type="button" class="quiet folder-change" aria-label="更改文稿导出位置">更改</button></div></div>
    <div id="exportPathStatus" class="status-line" role="status"></div>
  </div>
  <hr><p>模型：<b>百炼录音 paraformer-v2</b></p><label for="apiKey">百炼 API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="优先Windows加密存储，不可用时仅保留运行内存"><div class="dialog-actions"><button id="saveKey">保存密钥</button><button id="checkKey" class="quiet">检查连接</button></div><div id="keyStatus" class="status-line"></div>
</dialog>
<script src="/static/app.js"></script></body></html>
