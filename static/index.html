<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>长素材选句工作台</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><div class="brand"><span class="brand-icon">▥</span><div><b>长素材选句工作台</b><small>从文稿选内容，让片段成片</small></div></div><div class="head-actions"><span id="saveState" class="muted">本地项目</span><button id="settingsBtn" class="quiet">设置</button></div></header>
<div class="import-bar"><input id="sourcePath" value="D:\test_longvideo" aria-label="素材文件或文件夹路径"><button id="importBtn">导入素材</button><select id="projectSelect" aria-label="选择原视频"><option value="">选择原视频</option></select><span id="sourceMeta" class="muted"></span></div>
<main>
<section class="preview-panel"><div class="section-title"><h2>原片预览</h2><span id="playTime" class="mono">00:00</span></div><video id="video" controls preload="metadata"></video><div class="preview-actions"><label>播放速度 <select id="speed"><option>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><button id="stopPreview" class="quiet">停止组预览</button></div><div id="nowPlaying" class="now-playing">点击文稿中的句子，跳转到对应画面</div><div class="panel-note">原片保留完整。成片按组内顺序拼接，字幕不烧录进画面。</div><div class="section-title"><h2>后台任务</h2><button id="refreshJobs" class="quiet">刷新</button></div><div id="jobs" class="jobs"><div class="empty">暂无任务</div></div><div class="section-title"><h2>已导出</h2><button id="refreshExports" class="quiet">刷新</button></div><div id="exports" class="exports"></div></section>
<section class="transcript-panel"><div class="section-title"><h2>转写文稿 <span id="sentenceCount" class="badge">0</span></h2><button id="transcribeBtn">转写整条</button></div><div class="transcript-tools"><input id="search" placeholder="搜索文稿，例如：记忆法" aria-label="搜索文稿"><button id="sampleBtn" class="quiet">先测90秒</button></div><div class="selection-tools"><span id="selectionCount" class="muted">未选择句子</span><button id="clearSelection" class="quiet">清除</button><button id="addSelected">加入当前组 →</button></div><div id="transcript" class="transcript"><div class="empty large">导入视频后，点击「先测90秒」或「转写整条」。<br>转写完成后可点选整句，Shift 连续选择。</div></div></section>
<section class="groups-panel"><div class="section-title"><h2>短片分组</h2><button id="newGroup" class="quiet">＋ 新建</button></div><div id="groupTabs" class="group-tabs"></div><div class="name-row"><label for="groupName">导出名称</label><input id="groupName" placeholder="例如：记忆法适合哪些孩子"></div><div class="group-tools"><span id="groupDuration" class="mono">00:00</span><button id="undo" class="quiet">撤销</button><button id="deleteGroup" class="danger quiet">删除组</button></div><p class="hint">拖动句子调整顺序；连续原句会保留原有停顿。</p><div id="groupItems" class="group-items"><div class="empty">选择文稿中的句子，加入当前组。</div></div><div class="export-controls"><button id="previewGroup" class="quiet">预览当前组</button><button id="planExports" class="quiet">查看导出清单</button><button id="exportGroup">导出当前组</button><button id="exportAll">导出全部组</button></div><div id="exportPlan" class="export-plan"></div></section>
</main>
<div id="toast" class="toast" role="status"></div>
<dialog id="settings"><div class="section-title"><h2>本机设置</h2><button id="closeSettings" class="quiet">关闭</button></div><p>模型：<b>百炼录音 paraformer-v2</b></p><label>百炼 API Key<input id="apiKey" type="password" autocomplete="off" placeholder="优先Windows加密存储，不可用时仅保留运行内存"></label><div class="dialog-actions"><button id="saveKey">保存密钥</button><button id="checkKey" class="quiet">检查连接</button></div><div id="keyStatus" class="status-line"></div><hr><p id="budgetInfo" class="muted"></p><p class="muted">验证版使用48小时临时音频存储。原视频不上传，音频与转写结果本地缓存。</p></dialog>
<script src="/static/app.js"></script></body></html>
